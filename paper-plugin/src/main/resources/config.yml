# AntiCheat config (Paper + Fabric condividono gli stessi nomi)
# Modificabile a mano oppure dalla GUI con /ac -> Impostazioni
admins:
  uuids:
    - "00000000-0000-0000-0000-000000000000" # <-- metti qui gli UUID staff (oppure da console: ac add <nome>)
  use-permission-too: true # fallback a permesso 'anticheat.admin' / LuckPerms
punishments:
  warn-vl: 20
  kick-vl: 50
  ban-vl: 100
setback: # riporta a terra ai flag movimento (Speed/Fly/Step/NoFall/Scaffold)
  enabled: true
  min-vl: 15
test-mode: false # se true: logga tutto ma non kicka/banna e niente setback
packet-checks: true # solo con ProtocolLib installato: timer preciso + range preciso
checks: # true = attivo, false = disattivo
  Speed: true
  Fly: true
  NoFall: true
  Step: true
  Scaffold: true
  Reach: true
  KillAura: true
  AutoClicker: true
  FastBreak: true
  AutoTotem: true # beta: tolleranza alta
  XRay: true # statistico: avvisa lo staff, non banna da solo
  Sprint: true
  NoSlow: true
  Timer: true # di fatto solo Paper (su Fabric non scatta)
  Jesus: true
  GUIMove: true
  Multitask: true # sperimentale: gira solo con experimental-checks
  Spider: true # sperimentale: gira solo con experimental-checks
  AimSnap: true
  AimLock: true
experimental-checks: false # attiva i check sperimentali (piu FP)
tuning: # sensibilita (modificabile anche dalla GUI)
  autoclicker-std: 4.0 # deviazione max click: 2.5 rigido, 4.0 normale, 6.0 largo
  cps-limit: 25 # CPS massimi: sopra (sostenuti ~2s) = macro. Ummano ~25, /ac cps <n> per cambiarlo
xray:
  min-stone: 500 # pietra minima scavata prima di giudicare
  min-ores: 10 # diamanti minimi prima di giudicare
  ratio: 0.03 # rapporto diamanti/pietra sospetto (0.03 = 3%)
  cooldown-min: 30 # minuti tra un alert e l'altro (stesso player)
client-mod:
  required: false # se true, chi non ha la mod viene kickato (sconsigliato)
  min-version: "0.1.0"
debug:
  verbose: false
